<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laranja Bank | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login" class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="/index.html"><span class="brand-mark">LB</span><span>Laranja Bank</span></a><nav class="nav-links"><a class="nav-link" href="/index.html">Início</a><a class="nav-cta" href="/cadastro.html">Abra sua conta</a></nav></header>
  <main class="auth-modern">
    <section class="auth-photo"><img src="https://images.unsplash.com/photo-1601597111158-2fceff292cdc?auto=format&fit=crop&w=900&q=80" alt="Pessoa acessando conta bancária"><div class="auth-copy"><span class="eyebrow dark">Acesso seguro</span><h1>Entre no seu Laranja Bank</h1><p>Faça login para consultar contas, movimentar saldo e visualizar extratos.</p></div></section>
    <section class="auth-panel"><h2>Login do cliente</h2><p>Use seu e-mail e senha cadastrados.</p><form id="loginForm" class="form-grid"><div class="field"><label for="email">E-mail</label><input id="email" class="control" type="email" placeholder="cliente@email.com" autocomplete="email" required></div><div class="field"><label for="senha">Senha</label><input id="senha" class="control" type="password" placeholder="Sua senha" autocomplete="current-password" required></div><button class="btn-primary full" type="submit">Entrar na conta</button><a class="auth-link" href="/cadastro.html">Ainda não tenho conta</a></form></section>
  </main>
  <div id="toastArea" class="toast-area"></div><script src="/js/app.js"></script>
</body>
</html>
