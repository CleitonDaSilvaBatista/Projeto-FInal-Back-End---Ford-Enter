<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laranja Bank | Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="cadastro" class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="/index.html"><span class="brand-mark">LB</span><span>Laranja Bank</span></a><nav class="nav-links"><a class="nav-link" href="/index.html">Início</a><a class="nav-link" href="/login.html">Login</a></nav></header>
  <main class="auth-modern reverse">
    <section class="auth-panel"><h2>Abra sua conta</h2><p>Cadastro rápido para acessar a área bancária.</p><form id="registerForm" class="form-grid"><div class="field"><label for="nome">Nome completo</label><input id="nome" class="control" placeholder="Seu nome" autocomplete="name" required></div><div class="field"><label for="email">E-mail</label><input id="email" class="control" type="email" placeholder="cliente@email.com" autocomplete="email" required></div><div class="field"><label for="senha">Senha</label><input id="senha" class="control" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required></div><button class="btn-primary full" type="submit">Criar conta grátis</button><a class="auth-link" href="/login.html">Já tenho acesso</a></form></section>
    <section class="auth-photo"><img src="https://images.unsplash.com/photo-1579621970795-87facc2f976d?auto=format&fit=crop&w=900&q=80" alt="Planejamento financeiro"><div class="auth-copy"><span class="eyebrow dark">Novo cliente</span><h1>Uma conta digital para sua rotina</h1><p>Depois do cadastro, você já pode criar contas e movimentar valores.</p></div></section>
  </main>
  <div id="toastArea" class="toast-area"></div><script src="/js/app.js"></script>
</body>
</html>
